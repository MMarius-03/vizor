<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07090C" />
    <meta name="description" content="Vizor - vezi marja, nu eticheta." />
    <title>Vizor</title>
    <link rel="stylesheet" href="css/vizor.css" />
  </head>
  <body>
    <main id="app">
      <section class="screen start-screen is-active" aria-labelledby="start-title">
        <div class="brand" aria-label="Vizor">VIZOR</div>
        <div class="start-content">
          <p class="eyebrow">MARJA, VIZUAL</p>
          <h1 id="start-title">Vezi marja,<br />nu eticheta.</h1>
          <p class="intro">Ridică un card în fața camerei. Vizor identifică produsul și îți arată dacă îți aduce bani.</p>
          <ol class="steps" aria-label="Cum funcționează">
            <li><span>1</span>Pornești camera</li>
            <li><span>2</span>Ridici cardul</li>
            <li><span>3</span>Vezi marja</li>
          </ol>
        </div>
        <div class="start-actions">
          <button class="button primary" id="start-camera" type="button">Pornește camera</button>
          <p class="privacy">Camera e folosită doar local. Nimic nu se trimite nicăieri.</p>
          <p class="setup-link"><a href="ar-test.html">Deschide testul AR</a></p>
        </div>
      </section>
      <section class="screen scanner-screen" id="scanner-screen" aria-label="Scanner Vizor"></section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
