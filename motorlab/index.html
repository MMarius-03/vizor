<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081114" />
  <meta name="description" content="MotorLab: pornește motorul V8, controlează turația și mută piesele direct cu degetul sau cu mâna." />
  <title>MotorLab · Atelier V8</title>
  <link rel="stylesheet" href="./motorlab.css?v=2" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <a class="wordmark" href="../index.html"><span class="mark" aria-hidden="true">///</span> MOTOR<span>LAB</span></a>
      <span class="edition">ATELIER V8 <b>02</b></span>
      <div class="camera-actions">
        <button id="camera-toggle" type="button" aria-pressed="false">◉ <span>Camera</span></button>
        <button id="camera-switch" type="button" hidden aria-label="Comută camera">⇄ <span id="camera-facing">Spate</span></button>
      </div>
    </header>

    <section class="stage" aria-label="Atelier 3D interactiv">
      <video id="camera-feed" autoplay muted playsinline webkit-playsinline aria-hidden="true"></video>
      <div class="camera-shade" aria-hidden="true"></div>
      <div id="viewport"></div>
      <div class="stage-heading">
        <span class="eyebrow">PRINDE. MUTĂ. EXPLOREAZĂ.</span>
        <h1>Ia motorul<br /><em>piesă cu piesă.</em></h1>
        <p id="instruction">Prinde direct o piesă și las-o unde vrei.</p>
      </div>
      <div class="view-controls" role="group" aria-label="Controale vizualizare">
        <button id="interior-toggle" type="button" aria-pressed="true">◈ <span>Interior</span></button>
        <button id="orbit-toggle" type="button" aria-pressed="false">⟳ <span>Rotește</span></button>
        <button id="fit-view" type="button" aria-label="Încadrează toate piesele">⌖ <span>Încadrează</span></button>
      </div>
      <div id="part-label" class="part-label" hidden></div>
      <div id="hand-cursor" class="hand-cursor" aria-hidden="true" hidden><i></i></div>
      <div id="loading" class="loading" role="status"><span class="loading-ring" aria-hidden="true"></span><strong>Pregătesc atelierul</strong><span id="loading-detail">Încarc motorul V8...</span></div>
      <div id="error-panel" class="error-panel" role="alert" hidden><strong>Motorul nu s-a încărcat</strong><p id="error-detail"></p><button id="retry-load" type="button">Încearcă din nou</button></div>
      <div id="selected-card" class="selected-card" hidden>
        <div><span class="eyebrow" id="part-state">ÎN MOTOR</span><strong id="part-name"></strong></div>
        <button id="mount-part" type="button" disabled>Montează ↙</button>
        <button id="clear-selection" class="close-selection" type="button" aria-label="Închide detaliile piesei">×</button>
      </div>
      <div class="stage-status"><span><i aria-hidden="true"></i><span id="stage-status">ÎNCĂRCARE</span></span><span id="parts-count">0 piese pe banc</span></div>
    </section>

    <footer class="control-deck">
      <div class="engine-control">
        <button id="engine-toggle" class="engine-button" type="button" aria-pressed="false" disabled><span class="power-icon" aria-hidden="true">⏻</span><span id="engine-button-label">Pornește motorul</span></button>
        <div class="rpm-display"><strong id="rpm-value">0</strong><span>RPM <small>mișcare încetinită</small></span></div>
      </div>
      <label class="throttle" for="throttle">
        <span class="throttle-label"><b>ACCELERAȚIE</b><span>MIN <i aria-hidden="true">→</i> MAX</span></span>
        <input id="throttle" type="range" min="800" max="6500" step="100" value="800" aria-label="Turația motorului" />
        <span class="throttle-scale"><span>800</span><span>3.000</span><span>6.500 RPM</span></span>
      </label>
      <div class="bench-controls"><button id="assemble-all" type="button" disabled aria-label="Reasamblează toate piesele">↙ <span>Reasamblează</span></button><p id="gesture-status" role="status">Trage piesele · două degete pentru zoom</p></div>
    </footer>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script type="module" src="./motorlab.js?v=2"></script>
</body>
</html>
