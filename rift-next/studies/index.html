<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIFT / ATLAS + ORBIT — studii 3D</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#171a1a;color:#f1eee7;--accent:#4f9ed1;--edge:#536576;--muted:#a7bac4;--panel:#15202bed}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow:hidden}
    #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
    body[data-object=orbit]{--accent:#638bc6;--edge:#4e617d;--muted:#a4b1c0;--panel:#121b28ed}
    .top{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:16px;align-items:start}
    .brand{font-size:17px;font-weight:800;letter-spacing:-.05em}.brand span{font-weight:400;color:var(--muted)}
    .back{font:700 10px ui-monospace,monospace;letter-spacing:.1em;color:#f0f0eb;text-decoration:none;border-bottom:1px solid var(--accent);min-height:38px;display:inline-flex;align-items:center}
    .tag{font:10px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-align:right}
    .bottom{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));max-width:560px;margin:auto;background:var(--panel);border:1px solid var(--edge);border-top:3px solid var(--accent);padding:16px 18px 14px;box-shadow:0 14px 40px #0008}
    .choices{display:flex;gap:8px;margin-bottom:15px}
    button{font:700 11px ui-monospace,monospace;letter-spacing:.08em;background:transparent;color:#d4d8d5;border:1px solid var(--edge);padding:10px 13px;min-height:42px;cursor:pointer}
    button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#101210}
    .name{font-size:23px;font-weight:750;letter-spacing:-.04em;margin:0 0 3px}body[data-object=atlas] .name{font-family:Georgia,serif;letter-spacing:-.02em}
    .desc{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.4}
    .phase{font:700 10px ui-monospace,monospace;letter-spacing:.11em;color:var(--accent);margin:0 0 13px}
    .range-label{display:flex;justify-content:space-between;color:#d3d5cc;font:11px ui-monospace,monospace;letter-spacing:.04em;margin-bottom:8px}
    .effect-control{margin-top:8px}
    input{width:100%;accent-color:var(--accent);height:24px}
    .foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font:10px ui-monospace,monospace;margin-top:8px}
    @media(max-width:520px){.bottom{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:12px}.desc{font-size:12px}.name{font-size:20px}.choices button{font-size:10px;padding:8px}}
    @media(orientation:landscape) and (max-height:500px){.top{top:10px;left:12px;right:12px}.bottom{left:auto;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(320px,46vw);padding:10px}.choices{gap:5px;margin-bottom:8px}.choices button{font-size:9px;padding:6px;min-height:35px}.name{font-size:18px}.desc,.foot{display:none}.phase{margin:6px 0;font-size:9px}.range-label{margin:7px 0 2px}.tag{display:none}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="scene" aria-label="Machetă 3D ATLAS sau ORBIT"></canvas>
  <div class="top"><div><div class="brand" id="brand">ATLAS<span> / RIFT</span></div><div class="tag">STUDIU BETA · TRAGE PENTRU ALT UNGHI</div></div><a id="back" class="back" href="../choose.html">← TOATE OBIECTELE</a></div>
  <section class="bottom" aria-label="Controale pentru machete">
    <div class="choices"><button id="atlas" type="button" aria-pressed="true">01 / ATLAS</button><button id="orbit" type="button" aria-pressed="false">02 / ORBIT</button><button id="technical" type="button" aria-pressed="false">VEDERE TEHNICĂ</button></div>
    <h1 class="name" id="name">ATLAS — campus în miniatură</h1>
    <p class="desc" id="description">O insulă construită în straturi, ridicată din planul ecranului.</p>
    <p class="phase" id="phase" aria-live="polite">04 / CAMPUS COMPLET</p>
    <label class="range-label" for="progress"><span id="range-name">CONSTRUIEȘTE</span><span id="value">74%</span></label>
    <input id="progress" type="range" min="0" max="100" value="74">
    <div class="effect-control"><label class="range-label" for="effect"><span id="effect-name">ACCENTUL PINULUI</span><span id="effect-value">65%</span></label><input id="effect" type="range" min="0" max="100" value="65"></div>
    <div class="foot"><span>GLISEAZĂ PE OBIECT PENTRU A-L ROTI</span><span>STUDIU VIZUAL · FĂRĂ CAMERĂ</span></div>
  </section>
  <script type="module" src="./study.js?v=9"></script>
</body>
</html>
