<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIFT / ATLAS + ORBIT — studii 3D</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#111311;color:#f1eee7}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow:hidden}
    #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
    .top{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:16px;align-items:start;pointer-events:none}
    .brand{font-size:14px;font-weight:800;letter-spacing:-.04em}.brand span{font-weight:400;color:#a6a8a1}
    .tag{font:10px ui-monospace,monospace;letter-spacing:.1em;color:#a6a8a1;text-align:right}
    .bottom{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));max-width:560px;margin:auto;background:#151816ee;border:1px solid #525851;padding:16px 18px 14px;box-shadow:0 14px 40px #0008}
    .choices{display:flex;gap:8px;margin-bottom:15px}
    button{font:700 11px ui-monospace,monospace;letter-spacing:.08em;background:transparent;color:#c8cbc3;border:1px solid #606760;padding:10px 13px;min-height:42px;cursor:pointer}
    button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#101210}
    .name{font-size:23px;font-weight:750;letter-spacing:-.04em;margin:0 0 3px}
    .desc{margin:0 0 14px;color:#b6b8b0;font-size:13px;line-height:1.4}
    .range-label{display:flex;justify-content:space-between;color:#d3d5cc;font:11px ui-monospace,monospace;letter-spacing:.04em;margin-bottom:8px}
    input{width:100%;accent-color:var(--accent);height:24px}
    .foot{display:flex;justify-content:space-between;gap:12px;color:#929a91;font:10px ui-monospace,monospace;margin-top:8px}
    @media(max-width:520px){.bottom{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:12px}.desc{font-size:12px}.tag{max-width:120px}.name{font-size:20px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="scene" aria-label="Machetă 3D ATLAS sau ORBIT"></canvas>
  <div class="top"><div class="brand">RIFT<span> / STUDII 3D</span></div><div class="tag">OBIECTE ÎNAINTE DE INTERFAȚĂ<br>TRAGE PENTRU ALT UNGHI</div></div>
  <section class="bottom" aria-label="Controale pentru machete">
    <div class="choices"><button id="atlas" type="button" aria-pressed="true">01 / ATLAS</button><button id="orbit" type="button" aria-pressed="false">02 / ORBIT</button><button id="technical" type="button" aria-pressed="false">VEDERE TEHNICĂ</button></div>
    <h1 class="name" id="name">ATLAS — oraș în miniatură</h1>
    <p class="desc" id="description">O insulă construită în straturi, ridicată din planul ecranului.</p>
    <label class="range-label" for="progress"><span id="range-name">CONSTRUIEȘTE</span><span id="value">74%</span></label>
    <input id="progress" type="range" min="0" max="100" value="74">
    <div class="foot"><span>GLISEAZĂ PE OBIECT PENTRU A-L ROTI</span><span>STUDIU VIZUAL · FĂRĂ CAMERĂ</span></div>
  </section>
  <script type="module" src="./study.js?v=1"></script>
</body>
</html>
